buildscript {
    // 与 Flutter 插件 / stdlib 对齐；勿再用 1.6.x 编译器读 1.8+ metadata
    ext.kotlin_version = '1.9.22'
    repositories {
        // public/central 优先，避免阿里云 google 对 Kotlin 回 502 拖死构建
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven {
            url 'https://maven.aliyun.com/repository/google'
            content {
                includeGroupByRegex 'com\\.android.*'
                includeGroupByRegex 'com\\.google.*'
                includeGroupByRegex 'androidx.*'
            }
        }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven {
            url 'https://maven.aliyun.com/repository/google'
            content {
                includeGroupByRegex 'com\\.android.*'
                includeGroupByRegex 'com\\.google.*'
                includeGroupByRegex 'androidx.*'
            }
        }
    }

    configurations.all {
        resolutionStrategy.eachDependency { details ->
            // 避免 kotlin-stdlib 与旧版 jdk7/jdk8 扩展包重复类
            if (details.requested.group == 'org.jetbrains.kotlin' &&
                    details.requested.name.startsWith('kotlin-stdlib')) {
                details.useVersion(rootProject.ext.kotlin_version)
                details.because('Align Kotlin stdlib to avoid duplicate classes')
            }
        }
    }
}

// 插件自带 kotlin-gradle-plugin 1.6/1.7 时，统一拉到根版本，少下旧包、少踩 metadata
subprojects { sub ->
    sub.buildscript {
        configurations.classpath {
            resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                    details.useVersion(rootProject.ext.kotlin_version)
                    details.because('Align plugin Kotlin to root')
                }
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
