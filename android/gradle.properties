org.gradle.jvmargs=-Xmx2048M -Djava.net.preferIPv4Stack=true -Dfile.encoding=UTF-8
systemProp.java.net.preferIPv4Stack=true
android.useAndroidX=true
android.enableJetifier=true
# jetifier 不要改写 kotlin-stdlib（否则易出现 metadata 1.8 vs 1.6）
android.jetifier.ignorelist=kotlin-stdlib,kotlin-stdlib-jdk7,kotlin-stdlib-jdk8,kotlin-stdlib-common
# Windows 上 daemon/registry.bin、Binary store 常被锁；构建脚本也会设 GRADLE_USER_HOME
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
# 工程在 D:、Pub 缓存在 C: 时，Kotlin 增量编译会抛 different roots 崩掉
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.compiler.execution.strategy=in-process
